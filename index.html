<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anadolu Antik Kentleri — Gezi Sicili</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  color-scheme:light only;
  --paper:#E7E8E2;
  --card:#F3F4EF;
  --ink:#17242A;
  --ink-2:#57666B;
  --rule:#C3CAC5;
  --patina:#2C7A67;
  --patina-soft:#DCE9E4;
  --ochre:#8A6A1C;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;
  background-image:
    repeating-linear-gradient(115deg,transparent 0 38px,rgba(23,36,42,.035) 38px 39px),
    repeating-linear-gradient(65deg,transparent 0 54px,rgba(23,36,42,.025) 54px 55px);
}
html{background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px;background:var(--paper);color:var(--ink);min-height:100vh}

/* ---- masthead ---- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;margin:6px 0 4px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--patina)}
.lede{font-size:13px;color:var(--ink-2);margin:0 0 16px;max-width:52ch}

/* ---- trench profile (signature) ---- */
.trench{border:1px solid var(--rule);background:var(--card);padding:11px 12px 9px;margin-bottom:14px}
.trench-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.trench-hd span:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.trench-hd span:last-child{font-family:var(--mono);font-size:12px;font-weight:600}
.layer{display:grid;grid-template-columns:18px 1fr 46px;gap:8px;align-items:center;margin-bottom:5px}
.layer-k{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2)}
.layer-bar{height:11px;background:rgba(23,36,42,.07);position:relative;overflow:hidden}
.layer-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--patina);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.layer-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(255,255,255,.5) 13px 14px)}
.layer-n{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:right}

/* ---- controls ---- */
.controls{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 9px;margin-bottom:4px;border-bottom:1px solid var(--rule)}
input[type=search]{
  width:100%;padding:9px 11px;border:1px solid var(--rule);background:var(--card);color:var(--ink);
  font-family:var(--sans);font-size:14px;border-radius:0;-webkit-appearance:none;margin-bottom:7px
}
input[type=search]:focus{outline:2px solid var(--patina);outline-offset:-1px}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;border:1px solid var(--rule);background:transparent;color:var(--ink-2);cursor:pointer
}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chips+.chips{margin-top:5px}

/* ---- list ---- */
.tier{margin-top:22px}
.tier-hd{display:flex;align-items:baseline;gap:9px;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-bottom:2px}
.tier-k{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em}
.tier-t{font-family:var(--display);font-size:19px}
.tier-c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.tier[data-k=S] .tier-k{color:var(--ochre)}

.site{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;
  padding:11px 2px;border-bottom:1px solid var(--rule)}
.box{
  width:22px;height:22px;margin-top:1px;border:1.5px solid var(--ink-2);background:transparent;
  cursor:pointer;position:relative;flex:0 0 auto;padding:0
}
.box::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;
  border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(42deg) scale(.4);opacity:0;transition:.16s}
.site.done .box{background:var(--patina);border-color:var(--patina)}
.site.done .box::after{opacity:1;transform:rotate(42deg) scale(1)}
.name{font-weight:600;font-size:15px;line-height:1.25}
.site.done .name{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--patina);text-decoration-thickness:1.5px}
.meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.note{font-size:13px;color:var(--ink-2);margin-top:3px}
.go{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--patina);
  text-decoration:none;border:1px solid var(--patina);padding:4px 6px;white-space:nowrap;margin-top:1px}
.go:active{background:var(--patina-soft)}

.empty{padding:28px 4px;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
footer{margin-top:26px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 11px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.btn:active{background:var(--patina-soft)}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-left:auto}
.saved{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--patina);
  opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- sekmeler + harita ---- */
.tabs{display:flex;gap:0;margin:0 0 10px;border:1px solid var(--rule);background:var(--card)}
.tabs button{flex:1;min-height:44px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  background:transparent;border:0;color:var(--ink-2);cursor:pointer}
.tabs button+button{border-left:1px solid var(--rule)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
#mapPanel{display:none}
.mloading{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:26px 4px;letter-spacing:.04em}
.mchips{display:flex;gap:5px;margin:0 0 8px}
.mchips button{flex:1;min-height:40px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--rule);background:transparent;color:var(--ink-2);cursor:pointer}
.mchips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mstage{position:relative;border:1px solid var(--rule);background:var(--paper);overflow:hidden}
.mstage svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.mtools{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:5px}
.mtools button{min-width:40px;min-height:40px;font-family:var(--mono);font-size:14px;border:1px solid var(--rule);
  background:var(--card);color:var(--ink);cursor:pointer}
.mtools button#mfit{font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.mstamp{position:absolute;left:9px;top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);background:rgba(231,232,226,.85);padding:2px 5px}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 2px 0}
.mkey{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2)}
.mkey i{width:9px;height:9px;display:block}
.mkey-note{margin-left:auto;text-transform:none;letter-spacing:.02em}
.mhint{font-size:13px;color:var(--ink-2);margin:2px 0}
.mreg{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;width:100%;min-height:34px;
  border:0;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;padding:0 2px;text-align:left}
.mreg-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.mreg-bar{height:9px;background:rgba(23,36,42,.07);position:relative;overflow:hidden}
.mreg-bar i{position:absolute;inset:0 auto 0 0;background:var(--patina)}
.mreg-n{font-family:var(--mono);font-size:10px;color:var(--ink-2);text-align:right}
.mroute{width:100%}
.mrow{display:grid;grid-template-columns:22px 1fr auto 34px;gap:8px;align-items:center;min-height:40px;
  border-bottom:1px solid var(--rule)}
.mrn{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ochre)}
.mrname{font-size:14px;font-weight:600}
.mrmeta{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.mrx{min-height:34px;min-width:34px;border:0;background:transparent;color:var(--ink-2);font-size:18px;cursor:pointer}
.mrfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:9px;width:100%;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.mrfoot button{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  min-height:38px;padding:0 11px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.mrfoot button+button{margin-left:0}
.msheet{position:sticky;bottom:0;z-index:6;max-height:0;overflow:hidden;transition:max-height .22s ease;
  background:var(--card);border:1px solid var(--rule);border-top:2px solid var(--ink)}
.msheet.on{max-height:340px;margin-top:10px;padding:12px 13px 13px;position:relative}
.mclose{position:absolute;right:4px;top:2px;min-width:40px;min-height:40px;border:0;background:transparent;
  color:var(--ink-2);font-size:20px;cursor:pointer}
.mtier{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid;padding:2px 5px}
.mname{font-family:var(--display);font-size:24px;line-height:1.05;margin-top:6px}
.mmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.mnote{font-size:13.5px;color:var(--ink-2);margin:7px 0 10px;max-width:46ch}
.macts{display:flex;flex-wrap:wrap;gap:7px}
.mact{min-height:44px;padding:0 13px;display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);background:transparent;color:var(--ink);
  cursor:pointer;text-decoration:none}
.mact.mvisit.on{background:var(--patina);border-color:var(--patina);color:var(--paper)}
.mgo{border-color:var(--patina);color:var(--patina)}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Saha Defteri — Türkiye</p>
  <h1>Anadolu Antik Kentleri <em>Sicili</em></h1>
  <p class="lede">Kalıntının ayakta olma durumu, kazı ve sunum düzeyi, tarihsel ağırlık ve ziyaret edilebilirlik dikkate alınarak dört tabakaya ayrıldı. İşaretlediklerin cihazda saklanır.</p>

  <div class="trench">
    <div class="trench-hd"><span>Kazı Profili</span><span id="pct">%0</span></div>
    <div id="layers"></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="list" aria-pressed="true">Liste</button>
    <button data-tab="map" aria-pressed="false">Harita</button>
  </div>

  <div class="controls">
    <input type="search" id="q" placeholder="Kent veya il ara…" autocomplete="off">
    <div class="chips" id="tierChips"></div>
    <div class="chips" id="regChips"></div>
  </div>

  <div id="list"></div>
  <div id="mapPanel"><p class="mloading">Harita hazırlanıyor…</p></div>

  <footer>
    <button class="btn" id="copy">Listeyi kopyala</button>
    <button class="btn" id="reset">Sıfırla</button>
    <span class="saved" id="saved">kaydedildi</span>
    <span class="stat" id="stat"></span>
    <p class="meta" id="mode" style="flex-basis:100%;margin:6px 0 0;text-transform:none;letter-spacing:.02em"></p>
  </footer>
</div>

 ["C","Tamamlayıcı","Az kalıntı, çok bağlam"]
];
const KEY="antikkent.sicil.v1";
const slug=s=>s.toLowerCase().replace(/[ıİ]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const SITES=D.map(([name,il,reg,tier,note])=>({id:slug(name),name,il,reg,tier,note}));
const REGIONS=[...new Set(SITES.map(s=>s.reg))];

let done=new Set(), fTier="*", fReg="*", q="";

/* ---- storage: üç kademeli yedek ---- */
let mode="bellek";
async function readStore(){
  if(window.storage&&window.storage.get){
    try{const r=await window.storage.get(KEY); mode="cihaz"; if(r&&r.value)return r.value;}
    catch(e){ if(String(e).includes("not found")||String(e).includes("Key")) {mode="cihaz";return null;} }
  }
  try{const v=localStorage.getItem(KEY); if(v!==null||localStorage){mode="tarayıcı";return v;}}catch(e){}
  return null;
}
async function writeStore(val){
  if(mode==="cihaz"&&window.storage&&window.storage.set){
    try{ await window.storage.set(KEY,val); return true; }catch(e){ mode="tarayıcı"; }
  }
  try{ localStorage.setItem(KEY,val); mode="tarayıcı"; return true; }catch(e){}
  mode="bellek"; return false;
}
async function load(){
  const v=await readStore();
  if(v){ try{ done=new Set(JSON.parse(v)); }catch(e){} }
  render(); flagMode();
}
let t;
async function save(){
  const ok=await writeStore(JSON.stringify([...done]));
  const el=document.getElementById("saved");
  el.textContent = ok ? "kaydedildi" : "yalnız bu oturumda";
  el.classList.add("on"); clearTimeout(t); t=setTimeout(()=>el.classList.remove("on"),1600);
  flagMode();
}
function flagMode(){
  const n=document.getElementById("mode");
  n.textContent = mode==="bellek" ? "Kayıt kapalı — dosyayı indirip tarayıcıda açarsan işaretler kalıcı olur."
    : mode==="tarayıcı" ? "İşaretler bu tarayıcıda saklanıyor." : "İşaretler cihazda saklanıyor.";
}

/* ---- chips ---- */
function chips(){
  const tc=document.getElementById("tierChips"), rc=document.getElementById("regChips");
  const mk=(label,val,cur,fn)=>{const b=document.createElement("button");b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed",val===cur);b.onclick=()=>fn(val);return b;};
  tc.innerHTML="";rc.innerHTML="";
  tc.append(mk("Tümü","*",fTier,v=>{fTier=v;render();}));
  TIERS.forEach(([k])=>tc.append(mk("Tabaka "+k,k,fTier,v=>{fTier=v;render();})));
  tc.append(mk("Kalanlar","!",fTier,v=>{fTier=v;render();}));
  rc.append(mk("Her bölge","*",fReg,v=>{fReg=v;render();}));
  REGIONS.forEach(r=>rc.append(mk(r,r,fReg,v=>{fReg=v;render();})));
}

/* ---- render ---- */
function render(){
  chips();
  const list=document.getElementById("list"); list.innerHTML="";
  const qq=q.trim().toLowerCase();
  const match=s=>{
    if(fReg!=="*"&&s.reg!==fReg)return false;
    if(fTier==="!"&&done.has(s.id))return false;
    if(fTier!=="*"&&fTier!=="!"&&s.tier!==fTier)return false;
    if(qq&&!(s.name+" "+s.il+" "+s.note).toLowerCase().includes(qq))return false;
    return true;
  };
  let shown=0;
  TIERS.forEach(([k,title,sub])=>{
    const rows=SITES.filter(s=>s.tier===k&&match(s));
    if(!rows.length)return;
    shown+=rows.length;
    const sec=document.createElement("section");sec.className="tier";sec.dataset.k=k;
    const d=rows.filter(s=>done.has(s.id)).length;
    sec.innerHTML=`<div class="tier-hd"><span class="tier-k">${k}</span><span class="tier-t">${title}</span>
      <span class="tier-c">${d}/${rows.length}</span></div>
      <p class="meta" style="margin:5px 0 2px">${sub}</p>`;
    rows.forEach(s=>{
      const row=document.createElement("div");
      row.className="site"+(done.has(s.id)?" done":"");
      const url="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.name.replace(/\s*\(.*?\)/,"")+" "+s.il);
      row.innerHTML=`<button class="box" aria-label="${s.name} ziyaret edildi" aria-pressed="${done.has(s.id)}"></button>
        <div><div class="name">${s.name}</div>
        <div class="meta">${s.il} · ${s.reg}</div>
        <div class="note">${s.note}</div></div>
        <a class="go" href="${url}" target="_blank" rel="noopener">Harita</a>`;
      row.querySelector(".box").onclick=()=>{done.has(s.id)?done.delete(s.id):done.add(s.id);save();render();};
      sec.append(row);
    });
    list.append(sec);
  });
  if(!shown) list.innerHTML='<p class="empty">Bu filtreyle eşleşen kent yok. Aramayı kısalt ya da bölgeyi genişlet.</p>';
  profile();
  if(window.renderMap)window.renderMap();
}

function profile(){
  const box=document.getElementById("layers");box.innerHTML="";
  TIERS.forEach(([k,title])=>{
    const all=SITES.filter(s=>s.tier===k), d=all.filter(s=>done.has(s.id)).length;
    const row=document.createElement("div");row.className="layer";
    row.innerHTML=`<span class="layer-k">${k}</span><span class="layer-bar"><i style="width:${all.length?d/all.length*100:0}%"></i></span><span class="layer-n">${d}/${all.length}</span>`;
    box.append(row);
  });
  const pct=Math.round(done.size/SITES.length*100);
  document.getElementById("pct").textContent="%"+pct;
  document.getElementById("stat").textContent=`${done.size} / ${SITES.length} kent`;
}

/* ---- actions ---- */
document.getElementById("q").oninput=e=>{q=e.target.value;render();};
document.getElementById("reset").onclick=()=>{
  if(!confirm("Tüm işaretler silinsin mi?"))return;
  done=new Set();save();render();
};
document.getElementById("copy").onclick=async()=>{
  const txt=TIERS.map(([k,t])=>`## ${k} — ${t}\n`+SITES.filter(s=>s.tier===k)
    .map(s=>`${done.has(s.id)?"[x]":"[ ]"} ${s.name} (${s.il})`).join("\n")).join("\n\n");
  try{await navigator.clipboard.writeText(txt);document.getElementById("copy").textContent="Kopyalandı";
      setTimeout(()=>document.getElementById("copy").textContent="Listeyi kopyala",1400);}
  catch(e){alert("Kopyalanamadı. Metni elle seçmen gerekebilir.");}
};

"Perinthos":[40.968,27.955],"Ainos (Enez)":[40.727,26.081],"Apameia Myrleia":[40.375,28.878],

"Klazomenai":[38.315,26.766],"Kolophon":[38.104,27.148],"Larisa (Buruncuk)":[38.680,27.006],
"Yumuktepe":[36.800,34.610],"Çayönü":[38.223,40.048],"Sultantepe":[37.083,38.940],
"Oylum Höyük":[36.789,37.024],"Kaman-Kalehöyük":[39.379,33.699],"Dorylaion (Şarhöyük)":[39.798,30.545],
"Tavium":[39.891,34.842],"Nikomedia":[40.765,29.940],"Heraion Teikhos":[40.933,27.703],
"Bathonea":[41.010,28.783],"Amisos":[41.302,36.310]
};
</script>
<script>
/* Harita katmanı — index.html'in üstüne oturur. Bağımlılık: coords.js
   Geometri: world-atlas 110m (Natural Earth, kamu malı) bir kez indirilir,
   sonra tarayıcıda saklanır; sonraki açılışlar çevrimdışı çalışır. */
(function(){
const GEOKEY="antikkent.geo.tr.v3";
const TC={S:"#8A6A1C",A:"#2C7A67",B:"#3E5A61",C:"#8B9691"};
const W=820,H=430,PAD=16;
const B={lo0:25.4,lo1:45.3,la0:35.6,la1:42.4};
const my=la=>(180/Math.PI)*Math.log(Math.tan(Math.PI/4+la*Math.PI/360));
const S=Math.min((W-2*PAD)/(B.lo1-B.lo0),(H-2*PAD)/(my(B.la1)-my(B.la0)));
const OX=PAD+((W-2*PAD)-(B.lo1-B.lo0)*S)/2, OY=PAD+((H-2*PAD)-(my(B.la1)-my(B.la0))*S)/2;
const px=lo=>OX+(lo-B.lo0)*S, py=la=>OY+(my(B.la1)-my(la))*S;

let geo=null, mode="tier", sel=null, route=[], view={k:1,x:0,y:0}, drag=null, ready=false;

const el=id=>document.getElementById(id);
const withCoord=()=>SITES.filter(s=>COORD[s.name]);
function visible(s){
  const qq=(q||"").trim().toLowerCase();
  if(fReg!=="*"&&s.reg!==fReg)return false;
  if(fTier==="!"&&done.has(s.id))return false;
  if(fTier!=="*"&&fTier!=="!"&&s.tier!==fTier)return false;
  if(qq&&!(s.name+" "+s.il+" "+s.note).toLowerCase().includes(qq))return false;
  return true;
}
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const gmaps=s=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.name.replace(/\s*\(.*?\)/,"")+" "+s.il);
function dist(a,b){const[la1,lo1]=COORD[a.name],[la2,lo2]=COORD[b.name];
  const R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const h=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}

/* ---- geometri ---- */
async function loadGeo(){
  try{const c=localStorage.getItem(GEOKEY); if(c)return JSON.parse(c);}catch(e){}
  if(!window.topojson)return null;
  try{
    const t=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(r=>r.json());
    const fc=topojson.feature(t,t.objects.countries);
    const f=fc.features.find(x=>String(x.id)==="792")||fc.features.find(x=>/^t(ü|u)rk(iye|ey)$/i.test((x.properties&&x.properties.name)||""));
    if(!f)return null;
    const r=n=>Math.round(n*1000)/1000;
    const g=JSON.parse(JSON.stringify(f.geometry));
    const walk=a=>Array.isArray(a[0])?a.map(walk):[r(a[0]),r(a[1])];
    g.coordinates=walk(g.coordinates);
    const out={type:"Feature",geometry:g};
    try{localStorage.setItem(GEOKEY,JSON.stringify(out));}catch(e){}
    return out;
  }catch(e){return null;}
}
function landPath(){
  if(!geo)return "";
  const polys=geo.geometry.type==="Polygon"?[geo.geometry.coordinates]:geo.geometry.coordinates;
  return polys.map(poly=>poly.map(ring=>
    ring.map((c,i)=>(i?"L":"M")+px(c[0]).toFixed(1)+" "+py(c[1]).toFixed(1)).join("")+"Z"
  ).join("")).join("");
}

/* ---- görünüm ---- */
function fitTo(list){
  if(!list.length){view={k:1,x:0,y:0};return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  list.forEach(s=>{const[la,lo]=COORD[s.name];const x=px(lo),y=py(la);
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
  const m=40,w=Math.max(x1-x0+m*2,80),h=Math.max(y1-y0+m*2,80);
  const k=Math.min(W/w,H/h,6);
  view={k,x:W/2-k*(x0+x1)/2,y:H/2-k*(y0+y1)/2};
}
const clampK=k=>Math.max(1,Math.min(8,k));
function zoomAt(f,cx,cy){
  const k=clampK(view.k*f);
  view={k,x:cx-(cx-view.x)*(k/view.k),y:cy-(cy-view.y)*(k/view.k)};
  paint();
}

/* ---- çizim ---- */
function paint(){
  if(!ready)return;
  const g=el("mg"); if(!g)return;
  g.setAttribute("transform","translate("+view.x.toFixed(2)+","+view.y.toFixed(2)+") scale("+view.k.toFixed(3)+")");
  const r=(4.6/Math.sqrt(view.k)).toFixed(2), sw=(1.4/view.k).toFixed(2);
  const vis=withCoord().filter(visible);
  let pins="";
  vis.forEach(s=>{
    const[la,lo]=COORD[s.name],x=px(lo).toFixed(1),y=py(la).toFixed(1);
    const d=done.has(s.id), c=TC[s.tier], on=sel&&sel.id===s.id;
    const idx=route.findIndex(id=>id===s.id);
    if(mode==="cover"){
      pins+='<circle data-id="'+s.id+'" cx="'+x+'" cy="'+y+'" r="'+(d?r:(r*0.55).toFixed(2))+'" fill="'+(d?"#2C7A67":"none")+'" stroke="'+(d?"#2C7A67":"#8B9691")+'" stroke-width="'+sw+'" opacity="'+(d?1:.55)+'"/>';
    }else{
      pins+='<circle data-id="'+s.id+'" cx="'+x+'" cy="'+y+'" r="'+(on?(r*1.5).toFixed(2):r)+'" fill="'+(d?c:"#F3F4EF")+'" stroke="'+c+'" stroke-width="'+sw+'"/>';
      if(idx>-1)pins+='<text x="'+x+'" y="'+(+y-r*1.9).toFixed(1)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="'+(9/Math.sqrt(view.k)).toFixed(1)+'" font-weight="600" fill="#17242A">'+(idx+1)+'</text>';
    }
    if(on)pins+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*2.6).toFixed(2)+'" fill="none" stroke="'+c+'" stroke-width="'+sw+'" opacity=".5"/>';
  });
  let line="";
  if(mode==="route"&&route.length>1){
    const pts=route.map(id=>SITES.find(s=>s.id===id)).filter(s=>s&&COORD[s.name])
      .map(s=>{const[la,lo]=COORD[s.name];return px(lo).toFixed(1)+","+py(la).toFixed(1);}).join(" ");
    line='<polyline points="'+pts+'" fill="none" stroke="#8A6A1C" stroke-width="'+(1.8/view.k).toFixed(2)+'" stroke-dasharray="'+(5/view.k).toFixed(1)+" "+(3/view.k).toFixed(1)+'"/>';
  }
  el("mpins").innerHTML=line+pins;
  el("mcount").textContent=vis.length+" kent"+(mode==="cover"?" · "+vis.filter(s=>done.has(s.id)).length+" gezildi":"");
  sheet(); legend();
}

function legend(){
  const n=el("mlegend"); if(!n)return;
  if(mode==="cover"){
    const regs=[...new Set(SITES.map(s=>s.reg))];
    n.innerHTML=regs.map(rg=>{
      const all=SITES.filter(s=>s.reg===rg),d=all.filter(s=>done.has(s.id)).length;
      return '<button class="mreg" data-reg="'+esc(rg)+'"><span class="mreg-t">'+esc(rg)+'</span>'+
        '<span class="mreg-bar"><i style="width:'+(d/all.length*100).toFixed(0)+'%"></i></span>'+
        '<span class="mreg-n">'+d+"/"+all.length+'</span></button>';
    }).join("");
  }else if(mode==="route"){
    if(!route.length){n.innerHTML='<p class="mhint">Rota kurmak için pinlere sırayla dokun.</p>';}
    else{
      const rs=route.map(id=>SITES.find(s=>s.id===id)).filter(Boolean);
      let tot=0;for(let i=1;i<rs.length;i++)tot+=dist(rs[i-1],rs[i]);
      n.innerHTML='<div class="mroute">'+rs.map((s,i)=>
        '<div class="mrow"><span class="mrn">'+(i+1)+'</span><span class="mrname">'+esc(s.name)+
        '</span><span class="mrmeta">'+esc(s.il)+'</span><button class="mrx" data-drop="'+s.id+'" aria-label="çıkar">×</button></div>').join("")+
        '</div><div class="mrfoot"><span>'+rs.length+' durak · '+Math.round(tot)+' km kuş uçuşu</span>'+
        '<button class="mrclear">Rotayı boşalt</button><button class="mrcopy">Rotayı kopyala</button></div>';
    }
  }else{
    n.innerHTML=Object.keys(TC).map(k=>'<span class="mkey"><i style="background:'+TC[k]+'"></i>Tabaka '+k+'</span>').join("")+
      '<span class="mkey mkey-note">içi dolu = gezildi</span>';
  }
}

function sheet(){
  const n=el("msheet"); if(!n)return;
  if(!sel){n.className="msheet";n.innerHTML="";return;}
  const d=done.has(sel.id), inR=route.includes(sel.id);
  n.className="msheet on";
  n.innerHTML='<button class="mclose" aria-label="kapat">×</button>'+
    '<span class="mtier" style="color:'+TC[sel.tier]+';border-color:'+TC[sel.tier]+'">Tabaka '+sel.tier+'</span>'+
    '<div class="mname">'+esc(sel.name)+'</div>'+
    '<div class="mmeta">'+esc(sel.il)+" · "+esc(sel.reg)+'</div>'+
    '<p class="mnote">'+esc(sel.note)+'</p>'+
    '<div class="macts"><button class="mact mvisit'+(d?" on":"")+'">'+(d?"✓ Gezildi":"Gezildim işaretle")+'</button>'+
    (mode==="route"?'<button class="mact mroutebtn">'+(inR?"Rotadan çıkar":"Rotaya ekle")+'</button>':"")+
    '<a class="mact mgo" href="'+gmaps(sel)+'" target="_blank" rel="noopener">Google Haritalar</a></div>';
}

/* ---- olaylar ---- */
function wire(){
  const svg=el("msvg");
  svg.addEventListener("pointerdown",e=>{
    const c=e.target.closest("circle[data-id]");
    drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false,pin:c?c.getAttribute("data-id"):null};
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove",e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
    if(!drag.moved)return;
    const sc=W/svg.getBoundingClientRect().width;
    view.x=drag.vx+dx*sc;view.y=drag.vy+dy*sc;paint();
  });
  svg.addEventListener("pointerup",e=>{
    if(drag&&!drag.moved){
      if(drag.pin){
        const s=SITES.find(x=>x.id===drag.pin);
        if(mode==="route"){toggleRoute(s.id);sel=s;}
        else sel=(sel&&sel.id===s.id)?null:s;
        paint();
      }else{sel=null;paint();}
    }
    drag=null;
  });
  svg.addEventListener("wheel",e=>{e.preventDefault();
    const b=svg.getBoundingClientRect(),sc=W/b.width;
    zoomAt(e.deltaY<0?1.18:1/1.18,(e.clientX-b.left)*sc,(e.clientY-b.top)*sc);},{passive:false});

  el("mzin").onclick=()=>zoomAt(1.4,W/2,H/2);
  el("mzout").onclick=()=>zoomAt(1/1.4,W/2,H/2);
  el("mfit").onclick=()=>{fitTo(withCoord().filter(visible));paint();};

  el("mmodes").onclick=e=>{
    const b=e.target.closest("button[data-mode]");if(!b)return;
    mode=b.getAttribute("data-mode");
    [...el("mmodes").children].forEach(c=>c.setAttribute("aria-pressed",c===b));
    paint();
  };
  el("mlegend").onclick=e=>{
    const rg=e.target.closest("button[data-reg]");
    if(rg){fReg=rg.getAttribute("data-reg");render();fitTo(withCoord().filter(visible));paint();return;}
    const dr=e.target.closest("button[data-drop]");
    if(dr){toggleRoute(dr.getAttribute("data-drop"));paint();return;}
    if(e.target.closest(".mrclear")){route=[];paint();return;}
    if(e.target.closest(".mrcopy")){
      const txt=route.map((id,i)=>{const s=SITES.find(x=>x.id===id);return(i+1)+". "+s.name+" ("+s.il+")";}).join("\n");
      navigator.clipboard&&navigator.clipboard.writeText(txt);
      e.target.textContent="Kopyalandı";setTimeout(()=>{e.target.textContent="Rotayı kopyala";},1400);
    }
  };
  el("msheet").onclick=e=>{
    if(e.target.closest(".mclose")){sel=null;paint();return;}
    if(e.target.closest(".mvisit")){done.has(sel.id)?done.delete(sel.id):done.add(sel.id);save();render();paint();return;}
    if(e.target.closest(".mroutebtn")){toggleRoute(sel.id);paint();}
  };
}
function toggleRoute(id){
  const i=route.indexOf(id);
  if(i>-1)route.splice(i,1);else route.push(id);
}

async function init(){
  const host=el("mapPanel");
  geo=await loadGeo();
  host.querySelector(".mloading").remove();
  host.insertAdjacentHTML("afterbegin",
    '<div class="mchips" id="mmodes">'+
      '<button data-mode="tier" aria-pressed="true">Tabaka haritası</button>'+
      '<button data-mode="route" aria-pressed="false">Rota kur</button>'+
      '<button data-mode="cover" aria-pressed="false">Kazı örtüsü</button>'+
    '</div>'+
    '<div class="mstage">'+
      '<svg id="msvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
        '<g id="mg">'+
          (geo?'<path d="'+landPath()+'" fill="#F3F4EF" stroke="#17242A" stroke-width="1" stroke-linejoin="round"/>'
             :'<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" fill="#57666B">Harita geometrisi indirilemedi — bir kez çevrimiçi aç</text>')+
          '<g id="mpins"></g>'+
        '</g>'+
      '</svg>'+
      '<div class="mtools"><button id="mzin" aria-label="yakınlaştır">+</button><button id="mzout" aria-label="uzaklaştır">−</button><button id="mfit">Sığdır</button></div>'+
      '<span class="mstamp" id="mcount"></span>'+
    '</div>'+
    '<div class="mlegend" id="mlegend"></div>'+
    '<div class="msheet" id="msheet"></div>');
  ready=true;wire();view={k:1,x:0,y:0};paint();
}

window.renderMap=()=>{if(ready)paint();};
(function wireTabs(){
  const t=el("tabs");
  if(!t){setTimeout(wireTabs,30);return;}
  t.addEventListener("click",e=>{
    const b=e.target.closest("button[data-tab]");if(!b)return;
    const k=b.getAttribute("data-tab");
    [...t.children].forEach(c=>c.setAttribute("aria-pressed",c===b));
    el("list").style.display=k==="map"?"none":"block";
    el("mapPanel").style.display=k==="map"?"block":"none";
    if(k==="map"&&!ready)init();else paint();
  });
})();
})();
</script>
</body>
